name: Build FrameX Free Trial

on:
  push:
    branches: ["main"]
    paths:
      - "free-web/**"
      - ".github/workflows/deploy-free.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: free-web/package.json

      - name: Install
        working-directory: free-web
        run: npm install

      - name: Stamp engine cache version
        run: |
          sed -i 's/ffmpeg-core.js?v=2/ffmpeg-core.js?v=3/g' free-web/src/main.js
          sed -i 's/ffmpeg-core.wasm?v=2/ffmpeg-core.wasm?v=3/g' free-web/src/main.js

      - name: Build
        working-directory: free-web
        run: npm run build

      - name: Publish trial build to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./free-web/dist
          publish_branch: gh-pages
          force_orphan: true
